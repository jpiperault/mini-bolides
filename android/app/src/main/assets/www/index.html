<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mini Bolides</title>
<link rel="stylesheet" href="fonts.css">
<style>
/* Univers jouet : crème, tomate et beurre, gros boutons arrondis lisibles au pouce. Les menus laissent le haut libre pour la voiture. */
:root {
  --cream: #fff6e6; --ink: #2b2230; --muted: #7b6c72; --tomato: #e5352b; --tomato-d: #a82018; --butter: #ffd23f; --butter-d: #d9a514;
  --mint: #25b98a; --line: rgba(43, 34, 48, .14);
  --display: 'Unbounded', 'Arial Black', sans-serif; --body: 'Saira', 'Segoe UI', sans-serif;
  --top: max(12px, env(safe-area-inset-top)); --bot: max(16px, env(safe-area-inset-bottom));
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: #ffe6c4; color: var(--ink); font-family: var(--body); font-size: 16px;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; overscroll-behavior: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.screen { position: fixed; inset: 0; display: flex; flex-direction: column; }
.sheet { margin-top: auto; background: var(--cream); border-radius: 26px 26px 0 0; padding: 22px 18px calc(var(--bot) + 6px); box-shadow: 0 -8px 30px rgba(43, 34, 48, .22);
  max-height: 78vh; overflow-y: auto; touch-action: pan-y; }
h1, h2 { font-family: var(--display); margin: 0; letter-spacing: -.01em; }
h2 { font-size: 22px; font-weight: 800; }
/* Accueil : la voiture au centre, les trois rendez-vous du jour, un seul gros bouton, puis la barre d'onglets commune aux menus. */
:root { --tabh: calc(58px + var(--bot)); }
body.tabbed .screen { bottom: var(--tabh); } body.tabbed .screen .sheet { padding-bottom: 14px; }
#tabs { box-sizing: border-box; position: fixed; left: 0; right: 0; bottom: 0; height: var(--tabh); z-index: 4; display: flex; padding: 6px 6px var(--bot); background: var(--cream); box-shadow: 0 -1px 0 var(--line), 0 -6px 18px rgba(43, 34, 48, .12); }
#tabs button { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: 800 9.5px var(--display); color: var(--muted); border-radius: 14px; }
#tabs svg { width: 25px; height: 25px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#tabs button.on { color: var(--tomato); } #tabs button:active { background: rgba(43, 34, 48, .07); }
#home::before { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(43, 34, 48, .5) 0, rgba(43, 34, 48, 0) 17%, rgba(43, 34, 48, 0) 46%, rgba(43, 34, 48, .7) 80%, rgba(43, 34, 48, .88) 100%); }
#home > * { position: relative; }
.htop { height: 48px; margin: var(--top) 16px 0; display: flex; align-items: center; flex: none; }
.hbrand { font: 800 min(17px, 4.4vw) var(--display); color: var(--cream); letter-spacing: .5px; text-shadow: 0 2px 6px rgba(0, 0, 0, .45); } .hbrand i { color: var(--butter); font-style: normal; }
#home .hset { position: fixed; right: 14px; top: var(--top); width: 48px; height: 48px; border-radius: 16px; background: var(--cream); box-shadow: 0 3px 0 var(--line); display: grid; place-items: center; z-index: 4; }
.hset svg { width: 22px; height: 22px; stroke: var(--ink); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
body.athome #coinbar { right: 72px; }
#hDrag { flex: 1; min-height: 0; touch-action: none; display: flex; flex-direction: column; justify-content: flex-end; }
.harrow { position: absolute; top: 46%; width: 44px; height: 44px; margin-top: -22px; border-radius: 50%; background: rgba(255, 246, 230, .9); font: 800 20px/1 var(--display); padding-bottom: 3px; box-shadow: 0 3px 8px rgba(43, 34, 48, .25); }
.harrow.l { left: 12px; } .harrow.r { right: 12px; }
.hcar { text-align: center; color: var(--cream); text-shadow: 0 2px 8px rgba(0, 0, 0, .6); padding: 0 16px 14px; pointer-events: none; }
.hcar b { display: block; font: 800 19px var(--display); } .hcar span { font-size: 13.5px; font-weight: 600; opacity: .92; }
.hlow { flex: none; padding: 0 16px 16px; }
.hlow h3 { margin: 0 0 8px; font: 800 11px var(--display); letter-spacing: 1.5px; color: rgba(255, 246, 230, .88); text-transform: uppercase; }
.hcards { display: flex; gap: 10px; }
.hcard { flex: 1; min-width: 0; min-height: 104px; padding: 10px 10px 9px; border-radius: 16px; background: rgba(255, 246, 230, .97); display: flex; flex-direction: column; text-align: left; box-shadow: 0 4px 0 rgba(43, 34, 48, .25); }
.hcard:active { transform: translateY(3px); }
.hcard em { white-space: nowrap; overflow: hidden; font: 800 8.5px var(--display); font-style: normal; color: var(--tomato); letter-spacing: .3px; text-transform: uppercase; }
.hcard strong { font: 700 13px/1.2 var(--body); margin-top: 4px; flex: 1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.hcard small { font: 800 11px var(--display); color: var(--muted); display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.hcard .dot { flex: none; width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffe58a, #e0a51a); box-shadow: inset 0 0 0 1.5px #b9830d; }
.hcard .bar { height: 6px; border-radius: 3px; background: rgba(43, 34, 48, .14); overflow: hidden; } .hcard .bar i { display: block; height: 100%; background: var(--mint); }
.hcard.done { opacity: .8; } .hcard.done em, .hcard.done small { color: #14875f; }
.hcard.ready { background: var(--butter); animation: mpulse 1.4s ease-in-out infinite; }
.hplay { position: relative; margin-top: 16px; }
.hgo { width: 100%; min-height: 78px; padding: 0 20px; border-radius: 22px; background: var(--tomato); box-shadow: 0 6px 0 var(--tomato-d); color: #fff; display: flex; align-items: center; gap: 14px; text-align: left; }
.hgo:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--tomato-d); }
.hgo .tri { flex: none; width: 0; height: 0; border-left: 22px solid #fff; border-top: 14px solid transparent; border-bottom: 14px solid transparent; }
.hgo span { min-width: 0; } .hgo b { display: block; font: 800 22px var(--display); } .hgo small { display: block; font-size: 13.5px; font-weight: 600; opacity: .94; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hmode { position: absolute; right: 10px; top: 9px; height: 34px; padding: 0 12px; border-radius: 17px; background: rgba(255, 255, 255, .24); color: #fff; font: 800 10px var(--display); }
.hmode:active { background: rgba(255, 255, 255, .4); }
#modeList .row b { font-size: 26px; width: 34px; text-align: center; } #modeList .row span { flex: 1; font-family: var(--display); font-weight: 800; font-size: 15px; } #modeList .row small { display: block; font-family: var(--body); font-weight: 600; font-size: 12.5px; color: var(--muted); }
#briefSub { text-align: center; }
@media (max-height: 640px) { .hcard { min-height: 88px; } .hgo { min-height: 66px; } .hplay { margin-top: 12px; } .hcar { padding-bottom: 8px; } }
.btn { display: block; width: 100%; min-height: 58px; padding: 12px 16px; margin-top: 12px; border-radius: 18px; font-family: var(--display); font-weight: 800; font-size: 17px;
  background: #fff; box-shadow: inset 0 0 0 2px var(--line), 0 4px 0 var(--line); transition: transform .08s; }
.btn:active { transform: translateY(3px); }
.btn.primary { background: var(--tomato); color: #fff; box-shadow: 0 5px 0 var(--tomato-d); font-size: 20px; min-height: 66px; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.split .btn { font-size: 14px; padding: 10px 6px; }
.iconbtn { position: fixed; left: 14px; top: var(--top); width: 48px; height: 48px; border-radius: 16px; background: var(--cream); box-shadow: 0 3px 0 var(--line); font-size: 20px; font-weight: 700; }
#coinbar { position: fixed; right: 14px; top: var(--top); height: 48px; padding: 0 16px; border-radius: 16px; display: flex; align-items: center; gap: 6px; background: var(--cream);
  box-shadow: 0 3px 0 var(--line); font-family: var(--display); font-weight: 800; font-size: 15px; z-index: 4; font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 58px; padding: 10px 14px; margin-top: 10px; text-align: left; border-radius: 16px; background: #fff; box-shadow: inset 0 0 0 2px var(--line); font-weight: 600; }
.row span { flex: 1; } .row small { color: var(--muted); font-weight: 500; } .row i { font-style: normal; color: var(--tomato); font-weight: 700; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 2px 8px; margin: 0 -2px; touch-action: pan-x; scrollbar-width: none; }
.chip { flex: none; min-height: 48px; padding: 7px 14px; border-radius: 14px; background: #fff; box-shadow: inset 0 0 0 2px var(--line); font-weight: 600; }
.chip small { display: block; font-size: 12px; color: var(--muted); }
.chip.sel { background: var(--butter); box-shadow: inset 0 0 0 2px var(--butter-d); } .chip.lock { opacity: .78; }
#carInfo p { margin: 2px 0 8px; font-weight: 600; }
dl { display: grid; grid-template-columns: 100px 1fr; gap: 5px 10px; margin: 0; align-items: center; font-size: 13px; color: var(--muted); }
dt { margin: 0; } dd { margin: 0; height: 9px; border-radius: 5px; background: rgba(43, 34, 48, .1); overflow: hidden; }
dd u { display: block; height: 100%; background: var(--mint); border-radius: 5px; }
.label { font-weight: 600; margin: 14px 0 2px; font-size: 14px; color: var(--muted); }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; padding: 6px 0 2px; }
.swatch { width: 46px; height: 46px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(0, 0, 0, .14); color: #fff; font-size: 11px; font-weight: 700; text-shadow: 0 1px 2px #000; }
.swatch.sel { outline: 3px solid var(--ink); outline-offset: 2px; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; } .seg span { width: 100%; font-weight: 600; }
.seg button { flex: 1; min-height: 48px; border-radius: 14px; background: #fff; box-shadow: inset 0 0 0 2px var(--line); font-weight: 600; } .seg .sel { background: var(--butter); box-shadow: inset 0 0 0 2px var(--butter-d); }
.small { color: var(--muted); font-size: 13px; margin: 14px 0 0; text-align: center; }

/* Course */
#hud { pointer-events: none; }
#hud.duo { top: 50%; } #hud.duo .pill:first-child { box-shadow: inset 0 0 0 3px #e5352b, 0 3px 0 rgba(43, 34, 48, .2); }
#hud2 { position: fixed; left: 0; right: 0; top: 0; height: 50%; transform: rotate(180deg); pointer-events: none; }
#hud2[hidden] { display: none; }
#hud2::before { content: ''; position: absolute; left: 0; right: 0; top: -2px; height: 4px; background: #fff; box-shadow: 0 0 6px rgba(0,0,0,.4); }
#touch2 { position: absolute; inset: 0; pointer-events: auto; touch-action: none; }
#hud2 .topbar { top: 12px; } #hud2 .p2 { box-shadow: inset 0 0 0 3px #2f8bff, 0 3px 0 rgba(43, 34, 48, .2); }
#thumb2 { position: absolute; left: -35px; bottom: 96px; width: 70px; height: 70px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, .6); pointer-events: none; display: grid; place-items: center; }
#thumb2[hidden] { display: none; } #thumb2 i { width: 34px; height: 34px; border-radius: 50%; background: rgba(120, 180, 255, .9); }
#flash2 { position: absolute; top: 35%; left: 0; right: 0; text-align: center; font-family: var(--display); font-weight: 800; font-size: 26px; color: #fff; -webkit-text-stroke: 1.5px #1d5fb8; opacity: 0; pointer-events: none; }
#flash2.big { font-size: 64px; } #flash2.show { animation: pop .85s ease-out both; }
#itemBtn2 { pointer-events: auto; position: absolute; left: 50%; bottom: 8px; margin-left: -36px; width: 72px; height: 72px; border-radius: 22px; font-size: 36px; background: rgba(255, 246, 230, .5); }
#itemBtn2.full { background: #9cc8ff; box-shadow: 0 5px 0 #4f86d6; }
#touch { position: absolute; inset: 0; pointer-events: auto; touch-action: none; }
.topbar { position: absolute; top: var(--top); left: 12px; right: 12px; display: flex; align-items: flex-start; gap: 8px; }
.pill { background: rgba(255, 246, 230, .94); border-radius: 15px; padding: 7px 12px; font-family: var(--display); font-weight: 800; box-shadow: 0 3px 0 rgba(43, 34, 48, .2); font-variant-numeric: tabular-nums; }
#posPill { font-size: 34px; line-height: 1; color: var(--tomato); padding: 8px 12px; } #posSuf { font-size: 14px; vertical-align: super; }
.stats { font-size: 13px; line-height: 1.45; } .stats small { font-family: var(--body); color: var(--muted); font-weight: 600; }
#pauseBtn { pointer-events: auto; margin-left: auto; width: 46px; height: 46px; border-radius: 14px; background: rgba(255, 246, 230, .94); box-shadow: 0 3px 0 rgba(43, 34, 48, .2); font-weight: 800; }
#map { position: absolute; top: calc(var(--top) + 64px); right: 10px; width: 92px; height: 92px; }
#flash { position: absolute; top: 25%; left: 0; right: 0; text-align: center; font-family: var(--display); font-weight: 800; font-size: 28px; color: #fff; -webkit-text-stroke: 1.5px var(--tomato-d); paint-order: stroke fill; opacity: 0; }
#flash.big { font-size: 84px; } #flash.boost { color: var(--butter); }
#flash.show { animation: pop .85s ease-out both; }
@keyframes pop { 0% { opacity: 0; transform: scale(.5); } 18% { opacity: 1; transform: scale(1.12); } 30% { transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: scale(1.04); } }
#thumb { position: absolute; left: -35px; bottom: calc(var(--bot) + 96px); width: 70px; height: 70px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, .6); pointer-events: none; display: grid; place-items: center; }
#thumb[hidden] { display: none; }
#thumb i { width: 34px; height: 34px; border-radius: 50%; background: rgba(255, 210, 63, .9); }
#itemBtn { pointer-events: auto; position: absolute; left: 50%; bottom: calc(var(--bot) + 8px); margin-left: -41px; width: 82px; height: 82px; border-radius: 24px; font-size: 42px; background: rgba(255, 246, 230, .42); box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .55); }
#itemBtn.full { background: var(--butter); box-shadow: 0 5px 0 var(--butter-d); animation: wob .7s ease-in-out infinite alternate; }
@keyframes wob { to { transform: scale(1.07) rotate(3deg); } }
#driftWrap { position: absolute; left: 50%; bottom: calc(var(--bot) + 104px); margin-left: -70px; width: 140px; height: 12px; border-radius: 7px; background: rgba(43, 34, 48, .45); overflow: hidden; opacity: 0; transition: opacity .1s; }
#driftWrap.on { opacity: 1; } #driftBar { height: 100%; width: 100%; background: #fff; transform-origin: left; transform: scaleX(0); } #driftWrap.l1 #driftBar { background: #4fc3ff; } #driftWrap.l2 #driftBar { background: #ff9a2e; }
#hint { position: absolute; left: 22px; right: 22px; top: 40%; padding: 14px 16px; text-align: center; font-weight: 600; border-radius: 16px; background: rgba(255, 246, 230, .95); box-shadow: 0 4px 0 rgba(43, 34, 48, .2); }
.looks { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 12px; }
.look { min-width: 54px; min-height: 54px; border-radius: 14px; background: #fff; box-shadow: inset 0 0 0 2px var(--line); font: 900 18px Unbounded, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px 6px; }
.look span { width: 26px; height: 26px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(0,0,0,.15); }
.look b.deco { font-size: 22px; line-height: 1; }
.look small { font: 600 10px Saira, Arial, sans-serif; } .look.sel { background: var(--butter); box-shadow: inset 0 0 0 2px var(--butter-d); } .look:disabled { opacity: .45; }
.vars { display: flex; gap: 6px; margin: -2px 0 8px; } .vars button { flex: 1; min-height: 34px; border-radius: 11px; background: #fff; box-shadow: inset 0 0 0 2px var(--line); font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 4px; }
.vars small { font: 600 11px Saira, Arial, sans-serif; } .vars button:disabled { opacity: .4; }
/* Course libre : mondes en carrousel */
#tracks .sheet { max-height: 86vh; padding-left: 0; padding-right: 0; } #tracks .sheet > h2, #tracks .seg, #tracks .small, .wchips, .wgo { margin-left: 18px; margin-right: 18px; } #tracks .wgo { width: calc(100% - 36px); }
.wchips { display: flex; gap: 5px; margin-top: 10px; } .wchips button { flex: 1; height: 40px; border-radius: 12px; font-size: 19px; box-shadow: 0 2px 0 var(--line); transition: transform .15s; }
.wchips button.sel { transform: translateY(-2px); box-shadow: 0 0 0 3px var(--ink); } .wchips button.lock { filter: grayscale(1); opacity: .5; }
.wrail { position: relative; display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 10px 0 4px; scrollbar-width: none; touch-action: pan-x pan-y; } .wrail::-webkit-scrollbar { display: none; }
.wpage { flex: 0 0 86%; scroll-snap-align: center; min-height: 330px; } .wpage:first-child { margin-left: 7%; } .wpage:last-child { margin-right: 7%; }
.whero { position: relative; height: 118px; border-radius: 20px; padding: 11px 14px; color: #fff; overflow: hidden; box-shadow: 0 4px 0 var(--line); text-shadow: 0 1px 0 rgba(0,0,0,.25); }
.whero h3 { font: 800 21px var(--display); margin: 0; } .whero small { font-weight: 700; font-size: 12px; } .wem { position: absolute; right: 8px; top: 0; font-size: 58px; text-shadow: none; }
.whero em { position: absolute; left: 14px; bottom: 24px; font: 800 14px var(--display); font-style: normal; } .whero u { position: absolute; left: 14px; right: 14px; bottom: 11px; height: 9px; border-radius: 5px; background: rgba(255,255,255,.35); } .whero u i { display: block; height: 100%; border-radius: 5px; background: var(--butter); }
.wlock { margin-top: 10px; background: #fff; border-radius: 16px; padding: 22px 14px; text-align: center; font-weight: 600; color: var(--muted); box-shadow: inset 0 0 0 2px var(--line); } .wlock b { display: block; font: 800 17px var(--display); color: var(--ink); margin-bottom: 6px; }
.wline { margin-top: 8px; background: #fff; border-radius: 16px; box-shadow: inset 0 0 0 2px var(--line); } .wline.open { box-shadow: inset 0 0 0 2px var(--butter-d); }
.whead { display: flex; gap: 10px; align-items: center; width: 100%; padding: 8px 10px; text-align: left; } .wthumb { position: relative; flex: none; width: 50px; height: 50px; border-radius: 12px; } .wthumb svg { position: absolute; inset: 5px; width: 40px; height: 40px; }
.wnm { flex: 1; font-weight: 700; font-size: 14px; line-height: 1.15; } .wbadges { display: flex; gap: 4px; margin-top: 4px; } .wbadges span { font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 7px; background: #f3ebe0; color: var(--muted); } .wbadges span.done { background: #fff1b8; color: var(--ink); }
.wmodes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 0 10px 10px; } .wmodes button { background: #f7f0e6; border-radius: 12px; padding: 6px 2px; font-size: 17px; box-shadow: inset 0 0 0 2px transparent; }
.wmodes small { display: block; font: 600 10px Saira, Arial, sans-serif; color: var(--muted); font-variant-numeric: tabular-nums; } .wmodes button.sel { background: #fff4c7; box-shadow: inset 0 0 0 2px var(--butter-d); } .wmodes button:disabled { opacity: .45; }
.wdots { display: flex; justify-content: center; gap: 5px; margin: 8px 0 0; } .wdots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); } .wdots i.sel { width: 18px; border-radius: 4px; background: var(--ink); }
.wgo small { display: block; font: 700 12px var(--body); opacity: .9; margin-top: 2px; }
/* Salle des trophées : l'étagère 3D occupe le haut, la carte du trophée regardé et la rangée de pastilles en bas. */
#tDrag { position: absolute; inset: 0; touch-action: none; }
.tcount { position: absolute; left: 0; right: 0; top: calc(var(--top) + 22px); text-align: center; color: #ffe9b8; font-weight: 800; font-size: 18px; text-shadow: 0 2px 6px rgba(0, 0, 0, .6); pointer-events: none; }
.tcount b { color: #ffd23f; }
.tsheet { position: relative; padding-top: 16px; }
.tcard { display: flex; align-items: center; gap: 8px; text-align: center; }
.tcard div { flex: 1; min-width: 0; } .tcard h2 { font-size: 22px; } .tcard p { margin: 4px 0 0; font-weight: 600; font-size: 14px; opacity: .85; }
.tcard .tstate { display: inline-block; margin-top: 8px; padding: 4px 12px; border-radius: 99px; background: #fff; box-shadow: inset 0 0 0 2px var(--line); font-weight: 800; opacity: 1; }
.tcard .tstate.on { background: #fff1c4; box-shadow: inset 0 0 0 2px var(--butter-d); }
.tcard button { width: 46px; height: 46px; flex: none; border-radius: 16px; background: #fff; box-shadow: 0 3px 0 var(--line); font-size: 26px; font-weight: 800; }
.wtoy { font-style: normal; font-size: 14px; }
