<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Bolides — proposition de menu</title>
<link rel="stylesheet" href="../../fonts.css">
<style>
  :root { --cream: #fff6e6; --ink: #2b2230; --muted: #7b6c72; --tomato: #e5352b; --tomato-d: #a82018; --butter: #ffd23f; --mint: #25b98a;
    --display: 'Unbounded', 'Arial Black', sans-serif; --body: 'Saira', 'Segoe UI', sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 28px 24px 36px; background: #efe6d6; color: var(--ink); font: 15px/1.4 var(--body); }
  h1 { font: 800 24px var(--display); margin: 0 0 4px; }
  .lead { margin: 0 0 22px; color: var(--muted); max-width: 90ch; font-size: 16px; }
  .row { display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; }
  figure { margin: 0; width: 390px; }
  figcaption { margin-top: 12px; font-size: 14.5px; color: #4d4350; }
  figcaption b { display: inline-block; padding: 2px 10px; border-radius: 20px; color: #fff; background: #8a7f8f; font: 800 11px var(--display); margin-right: 6px; vertical-align: 2px; }
  figcaption b.n { background: var(--tomato); }
  figcaption ul { margin: 8px 0 0; padding-left: 18px; } figcaption li { margin: 3px 0; }
  .phone { position: relative; width: 390px; height: 844px; border-radius: 34px; overflow: hidden; background: #cbb89a center/cover no-repeat; box-shadow: 0 10px 30px rgba(43, 34, 48, .28), 0 0 0 6px #2b2230; }
  .phone.old { background-image: url(home0.png); }
  .phone.new { background-image: url(fond.png); }

  /* ---- Accueil proposé ---- */
  .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(43, 34, 48, .5) 0, rgba(43, 34, 48, 0) 17%, rgba(43, 34, 48, 0) 52%, rgba(43, 34, 48, .72) 84%, rgba(43, 34, 48, .9) 100%); }
  .top { position: absolute; left: 16px; right: 16px; top: 18px; display: flex; align-items: center; gap: 10px; }
  .brand { font: 800 17px var(--display); color: var(--cream); letter-spacing: .5px; text-shadow: 0 2px 6px rgba(0, 0, 0, .4); flex: 1; }
  .brand i { color: var(--butter); font-style: normal; }
  .pill { display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 18px; background: rgba(255, 246, 230, .94); font: 800 14px var(--display); }
  .dot { width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffe58a, #e0a51a); box-shadow: inset 0 0 0 1.5px #b9830d; }
  .round { width: 36px; height: 36px; border-radius: 50%; background: rgba(255, 246, 230, .94); display: grid; place-items: center; }
  .round svg { width: 19px; height: 19px; stroke: var(--ink); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  .car { position: absolute; left: 0; right: 0; top: 432px; text-align: center; color: var(--cream); text-shadow: 0 2px 8px rgba(0, 0, 0, .55); }
  .car b { display: block; font: 800 19px var(--display); }
  .car span { font-size: 13.5px; opacity: .9; }
  .arrow { position: absolute; top: 300px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255, 246, 230, .88); display: grid; place-items: center; font: 800 18px var(--display); color: var(--ink); }
  .arrow.l { left: 12px; } .arrow.r { right: 12px; }

  .today { position: absolute; left: 0; right: 0; top: 500px; }
  .today h3 { margin: 0 16px 8px; font: 800 11px var(--display); letter-spacing: 1.5px; color: rgba(255, 246, 230, .85); text-transform: uppercase; }
  .cards { display: flex; gap: 10px; padding: 0 16px; }
  .card { flex: 1; min-width: 0; height: 100px; padding: 10px 11px; border-radius: 16px; background: rgba(255, 246, 230, .96); display: flex; flex-direction: column; }
  .card em { white-space: nowrap; font: 800 8.5px var(--display); font-style: normal; color: var(--tomato); letter-spacing: .4px; }
  .card strong { font: 700 13px/1.2 var(--body); margin-top: 4px; flex: 1; }
  .card small { font: 800 11px var(--display); color: var(--muted); display: flex; align-items: center; gap: 4px; }
  .card small .dot { width: 12px; height: 12px; }
  .bar { height: 6px; border-radius: 3px; background: rgba(43, 34, 48, .14); margin-top: 6px; overflow: hidden; } .bar i { display: block; height: 100%; width: 33%; background: var(--mint); }
  .card.done { opacity: .78; } .card.done em { color: var(--mint); }

  .play { position: absolute; left: 16px; right: 16px; top: 652px; height: 78px; border-radius: 22px; background: var(--tomato); box-shadow: 0 6px 0 var(--tomato-d); color: #fff; display: flex; align-items: center; padding: 0 20px; gap: 14px; }
  .play .tri { width: 0; height: 0; border-left: 22px solid #fff; border-top: 14px solid transparent; border-bottom: 14px solid transparent; }
  .play b { display: block; font: 800 22px var(--display); }
  .play span { font-size: 13.5px; opacity: .92; }
  .mode { position: absolute; right: 28px; top: 664px; height: 28px; padding: 0 11px; border-radius: 14px; background: rgba(255, 255, 255, .22); color: #fff; font: 800 9.5px/28px var(--display); }

  .tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 84px; padding: 8px 6px 18px; background: var(--cream); display: flex; border-radius: 22px 22px 0 0; }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 800 9.5px var(--display); color: var(--muted); position: relative; }
  .tab svg { width: 25px; height: 25px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tab.on { color: var(--tomato); }
  .tab .n { position: absolute; top: 2px; right: 18px; min-width: 17px; height: 17px; border-radius: 9px; background: var(--tomato); color: #fff; font: 800 9.5px/17px var(--display); text-align: center; }
</style>
<h1>Mini Bolides — proposition de nouvel accueil</h1>
<p class="lead">Maquette à valider, rien n'est encore changé dans le jeu. Toutes les fonctions actuelles restent, elles sont seulement rangées autrement.</p>
<div class="row">
  <figure>
    <div class="phone old"></div>
    <figcaption><b>Aujourd'hui</b>9 boutons empilés, de même poids
      <ul><li>Le logo et la pile de boutons cachent la voiture.</li><li>Trois gros boutons pour les défis avant d'arriver aux circuits.</li><li>Réglages, boutique et trophées serrés sur une ligne.</li></ul></figcaption>
  </figure>
  <figure>
    <div class="phone new">
      <div class="shade"></div>
      <div class="top">
        <div class="brand">MINI <i>BOLIDES</i></div>
        <div class="pill"><span class="dot"></span>1 240</div>
        <div class="round"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></div>
      </div>
      <div class="arrow l">‹</div><div class="arrow r">›</div>
      <div class="car"><b>Le Bolide</b><span>Équilibrée · glisse pour changer de voiture</span></div>
      <div class="today">
        <h3>Aujourd'hui</h3>
        <div class="cards">
          <div class="card"><em>DÉFI DU JOUR</em><strong>Sans toucher un mur</strong><small><span class="dot"></span>+150</small></div>
          <div class="card"><em>SEMAINE · 4 J</em><strong>Grand Bain sous la pluie</strong><small><span class="dot"></span>+500</small></div>
          <div class="card"><em>MISSIONS 1/3</em><strong>Réussis 5 turbos</strong><div class="bar"><i></i></div></div>
        </div>
      </div>
      <div class="play"><div class="tri"></div><div><b>JOUER</b><span>Coupe de la Cuisine · course 2 sur 3</span></div></div>
      <div class="mode">Autre mode ▾</div>
      <div class="tabs">
        <div class="tab on"><svg viewBox="0 0 24 24"><path d="M3.5 11.5 12 4l8.5 7.5"/><path d="M6 10v9.5h12V10"/></svg>Accueil</div>
        <div class="tab"><svg viewBox="0 0 24 24"><path d="M5 20V5"/><path d="M5 5h13l-2.5 4 2.5 4H5"/></svg>Circuits</div>
        <div class="tab"><svg viewBox="0 0 24 24"><path d="M3 15.5c0-2 1-3 3.2-3.4l3-.5c1.4-2 2.8-2.8 5-2.8 2.4 0 3.8 1 4.9 2.9l1 .3c.7.3.9.9.9 1.7v1.8H3z"/><circle cx="7.5" cy="16" r="2"/><circle cx="16.5" cy="16" r="2"/></svg>Garage</div>
        <div class="tab"><svg viewBox="0 0 24 24"><path d="M7.5 4h9v5a4.5 4.5 0 0 1-9 0z"/><path d="M7.5 6H4.5c0 2.6 1.2 4 3.3 4.3M16.5 6h3c0 2.6-1.2 4-3.3 4.3M12 13.5V17M8.5 20h7M9.5 17h5v3h-5z"/></svg>Trophées<span class="n">2</span></div>
        <div class="tab"><svg viewBox="0 0 24 24"><path d="M5 9h14l-1 11H6z"/><path d="M9 9V7.5a3 3 0 0 1 6 0V9"/></svg>Boutique</div>
      </div>
    </div>
    <figcaption><b class="n">Proposition</b>un seul gros bouton, la voiture au centre
      <ul><li><b style="background:none;color:inherit;padding:0;font:700 14.5px var(--body)">Jouer</b> reprend là où tu en étais ; « Autre mode » ouvre Championnat, Course libre, Chrono, À deux.</li><li>Défi du jour, de la semaine et missions : trois cartes sur une ligne.</li><li>Barre du bas fixe sur tous les écrans : plus de bouton retour à chercher.</li><li>Pièces et réglages toujours en haut.</li></ul></figcaption>
  </figure>
</div>
</html>
